name: pwnsec-support-handout

services:
  challenge:
    build:
      context: .
      dockerfile: Dockerfile
    image: pwnsec-support:handout
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    depends_on:
      - challenge
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/tmp/pwnsec-nginx.conf:ro
    command: >
      /bin/sh -c "sed 's/127.0.0.1:8080/challenge:8080/'
      /tmp/pwnsec-nginx.conf > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    restart: unless-stopped
