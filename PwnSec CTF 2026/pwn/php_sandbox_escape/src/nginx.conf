server {
    listen       80;
    server_name  localhost;

    root /home/ctf/scripts;
    # init.sh writes index.php here; without this, / looks for index.html
    # and nginx answers 403, so neither players nor the healthcheck can reach it.
    index index.php;
    
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  /home/ctf/scripts/$fastcgi_script_name;
        include        fastcgi_params;
    }
}