  var cur=document.createElement("span"); cur.className="cur";

  
  var HELLO={

  };
  var DIRECTORY={
    10:'REM   DIRECTORATE FIELD DIRECTORY',
    20:'PRINT "SENTINEL DIRECTORATE :: FIELD DIRECTORY"',
    30:'PRINT "------------------------------------"',
    40:'PRINT "PRESS RETURN TO FLIP EACH CARD."',

    280:'PRINT " AUTH: +65 7555 0117"',
    290:'PRINT " NOTE: ANSWERS ONLY TO ITS OWN"',
    300:'PRINT "       ORIGIN. CALLER ID = KEY."',

    320:'PRINT',
    330:'PRINT "END OF DIRECTORY."',
    340:'END'
  };
  var DISK={
    "HELLO WORLD":{t:"A",s:18,prog:HELLO},
    "DIRECTORY":{t:"A",s:9,prog:DIRECTORY},
    "FALKEN'S MAZE":{t:"A",s:6,prog:{}},
    "GLOBAL THERMONUCLEAR WAR":{t:"A",s:44,prog:{}},
    "README":{t:"T",s:2},
    "GLOSSARY":{t:"T",s:4},
    "SENTINEL.SYS":{t:"B",s:33},
    "AUDIT.LOG":{t:"T",s:6}
  };

  function render(){
    scr.textContent = out + (mode==="ready" ? (P+line) : "");
    scr.appendChild(cur);
    scr.scrollTop = scr.scrollHeight;
  }
  function nl(s){ out += s + "\n"; }
  function tick(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function waitKey(){ return new Promise(function(r){ resumeGet=r; }); }

  function catalog(){
    nl(""); nl("DISK VOLUME 254"); nl("");
    Object.keys(DISK).forEach(function(name){
      var f=DISK[name];
      nl(" "+f.t+" "+("00"+f.s).slice(-3)+" "+name);
    });
    nl("");
  }
  function listProg(){
    var nums=Object.keys(prog).map(Number).sort(function(a,b){return a-b;});
    nums.forEach(function(n){ nl(n+" "+prog[n]); });
  }
  function load(name){
    var f=DISK[name];
    if(!f){ nl("FILE NOT FOUND"); return false; }
    if(!f.prog){ nl("FILE TYPE MISMATCH"); return false; }
    prog={}; Object.keys(f.prog).forEach(function(k){ prog[k]=f.prog[k]; });
    return true;
  }
  function printArgs(rest){
    var m=rest.match(/"([^"]*)"/g);
    return m ? m.map(function(x){return x.slice(1,-1);}).join("") : "";
  }
  async function execLine(src){
    var s=src.trim(), U=s.toUpperCase();
    if(U.indexOf("REM")===0) return null;
    if(U==="END"||U==="STOP") return {end:1};
    if(U.indexOf("INPUT")===0){ out+="?"; render(); await waitKey(); nl(""); return null; }
    if(U.indexOf("GOTO")===0) return {goto:parseInt(U.slice(4),10)};
    if(U==="PRINT"){ nl(""); render(); await tick(20); return null; }
    if(U.indexOf("PRINT")===0){ nl(printArgs(s.slice(5))); render(); await tick(28); return null; }
    return null;
  }
  async function run(){
    var nums=Object.keys(prog).map(Number).sort(function(a,b){return a-b;});
    if(!nums.length){ return; }
    var idxOf={}; nums.forEach(function(n,i){ idxOf[n]=i; });
    mode="running"; render();
    var i=0, guard=0;
    while(i<nums.length && guard++<5000){
      var ctl=await execLine(prog[nums[i]]);
      if(ctl&&ctl.end) break;
      if(ctl&&ctl.goto!=null){ if(idxOf[ctl.goto]==null){ nl("?UNDEF'D STATEMENT ERROR"); break; } i=idxOf[ctl.goto]; continue; }
      i++;
    }
    mode="ready"; nl("");
  }
  async function process(raw){
    var s=raw.trim();
    if(s===""){ return; }
    var lm=s.match(/^(\d+)\s?(.*)$/);
    if(lm){ var n=+lm[1]; if(lm[2].trim()==="") delete prog[n]; else prog[n]=lm[2]; return; }
    var up=s.toUpperCase(), cmd=up.split(/\s+/)[0], name=up.slice(cmd.length).trim();
    if(cmd==="CATALOG"||cmd==="CAT"){ catalog(); return; }
    if(cmd==="HOME"||cmd==="CLEAR"){ out=""; return; }
    if(cmd==="NEW"){ prog={}; return; }
    if(cmd==="LIST"){ listProg(); return; }
    if(cmd==="LOAD"){ load(name); return; }
    if(cmd==="RUN"){ if(name){ if(!load(name)) return; } await run(); return; }
    if(cmd==="PRINT"){ nl(printArgs(s.slice(5))); return; }
    nl("?SYNTAX ERROR");
  }

  document.addEventListener("keydown", function(e){
    if(mode==="running"){
      if(resumeGet && e.key==="Enter"){ e.preventDefault(); var r=resumeGet; resumeGet=null; r(); }
      return;
    }
    if(e.key==="Enter"){ e.preventDefault(); out+=P+line+"\n"; var l=line; line=""; render();
      process(l).then(render); return; }
    if(e.key==="Backspace"){ e.preventDefault(); line=line.slice(0,-1); render(); return; }
    if(e.key.length===1 && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault();
      line += e.key.toUpperCase(); render(); }
  });
  crt.addEventListener("click", function(){ crt.focus(); });

  
  out =
    "INTEGER BASIC\n"+
    "SENTINEL DIRECTORATE\n\n";
  crt.focus(); render();
})();
</script>
